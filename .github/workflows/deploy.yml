name: Deploy PDV Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Recriar environment de produção
        run: |
          printf 'export const environment = {\n  production: true,\n  apiUrl: "/api"\n};\n' > src/environments/environment.prod.ts

      - name: Build de produção
        run: npx ng build --configuration=production

      # --- STEP DE DIAGNÓSTICO (temporário) ---
      # Mostra o IP público de saída do runner e a quem ele pertence (ASN/org).
      # Isso ajuda a confirmar se a Hostinger está bloqueando ranges de datacenter/cloud
      # (Azure, no caso dos runners hospedados do GitHub Actions).
      - name: Diagnóstico - IP de saída do runner
        run: |
          echo "== IP público do runner =="
          RUNNER_IP=$(curl -4 -s ifconfig.me)
          echo "IP: $RUNNER_IP"

          echo ""
          echo "== Informações de ASN/organização (via ipinfo.io) =="
          curl -s "https://ipinfo.io/${RUNNER_IP}/json" || true

          echo ""
          echo ""
          echo "== Teste de conectividade TCP na porta 22 da VPS =="
          timeout 10 bash -c "cat < /dev/null > /dev/tcp/${{ secrets.VPS_HOST }}/22" \
            && echo "Conexão TCP na porta 22: OK" \
            || echo "Conexão TCP na porta 22: FALHOU (timeout ou recusada)"

      - name: Copiar dist para VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "dist/dlara-frontend/"
          target: "/var/www/pdv/dist/"
          strip_components: 1
          overwrite: true
          timeout: 60s
          command_timeout: 10m

      - name: Recarregar nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            sudo systemctl reload nginx